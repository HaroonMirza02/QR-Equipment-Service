<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f26" />
    <meta name="description" content="A mobile equipment passport for installation, condition, maintenance and fault history." />
    <title>Equipment Passport · PlantOps</title>
    <link rel="stylesheet" href="/static/app/styles.css" />
    <script src="/static/app/profile.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="PlantOps home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span><strong>PlantOps</strong><small>Equipment passport</small></span>
      </a>
      <span class="secure-label"><span class="secure-dot"></span> Verified record</span>
    </header>

    <main id="app" class="app-shell" aria-live="polite">
      <section class="loading-state" aria-label="Loading equipment profile">
        <div class="loader-mark" aria-hidden="true"></div>
        <p class="eyebrow">Resolving equipment label</p>
        <h1>Opening equipment passport…</h1>
        <p>Checking the latest service and condition record.</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>PlantOps asset records</span>
      <span class="footer-separator">•</span>
      <span id="footer-state">Live data</span>
    </footer>

    <noscript>
      <div class="noscript">JavaScript is required to open this equipment profile.</div>
    </noscript>
  </body>
</html>
